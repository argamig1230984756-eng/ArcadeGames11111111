# Temple Run settings
enabled: true
default-min-players: 2
default-max-players: 16
round-seconds: 180

# Timer text appears above the hotbar.
timer-format: "&eTemple Run: &f{seconds}s"
checkpoints:
  enabled: true
  respawn-at-checkpoint: true
  coins-enabled: true
  coin-material: GOLD_NUGGET
  coin-value: 1
  first-second-third-results: true
